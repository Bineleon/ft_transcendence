services:
  # ========================
  # Backend
  # ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    volumes:
      - db-data:/app/database
      - avatars:/app/avatars
    networks:
      - app_network
    restart: unless-stopped

  # ========================
  # Frontend + Nginx
  # ========================
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile.prod
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - backend
    volumes:
      - avatars:/app/avatars
    networks:
      - app_network
    restart: unless-stopped

volumes:
  db-data:
  avatars:

networks:
  app_network:
    driver: bridge
